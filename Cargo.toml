[package]
name = "survivorsforge"
version = "0.1.0"
edition = "2024"
description = "Mod manager for Azeroth Survivors addons"
repository = "https://github.com/AlexEnotov/SurvivorsForge-Reborn"
license = "AGPL-3.0-or-later"

[workspace]
members = ["crates/forge-core", "crates/forge-scan", "crates/slint-toast"]
resolver = "3"

[[bin]]
name = "RebornAddonManager"
path = "src/main.rs"

[dependencies]
forge-core = { path = "crates/forge-core" }
forge-scan = { path = "crates/forge-scan" }
sha2 = "0.11"
url = "2"
slint = { version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
directories = "6"
rfd = "0.17"
trash = "5"
semver = "1"
open = "5"
arboard = { version = "3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tga", "bmp", "ico"] }

[build-dependencies]
serde_json = "1"
slint-toast = { path = "crates/slint-toast" }
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
