name: Build Reborn Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      REBORN_CATALOG_URL: ${{ vars.REBORN_CATALOG_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo build --release --locked -p survivorsforge
      - name: Package binary and corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/RebornAddonManager.exe, LICENSE, README.md package/
          git archive --format=zip --output=package/Source.zip HEAD
          Get-FileHash package/RebornAddonManager.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  RebornAddonManager.exe" } | Set-Content package/SHA256SUMS.txt
          Compress-Archive -Path package/* -DestinationPath RebornAddonManager-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RebornAddonManager-Windows
          path: RebornAddonManager-Windows.zip
