name: Reborn checks
on:
  workflow_dispatch:
  push:
    branches: [main, rebuild-main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo test --locked --workspace
      - name: Test generator with local scanner and launcher parser
        shell: pwsh
        run: |
          $env:FORGE_SCAN = (Resolve-Path target/debug/forge-scan.exe).Path
          $env:REBORN_MANAGER_CHECK = (Resolve-Path target/debug/RebornAddonManager.exe).Path
          node --test catalog/generate.test.mjs
      - name: Check offline interface interactions and render pages
        run: cargo test --locked --bin RebornAddonManager capture_ui -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: Reborn-interface-preview
          path: .qa/ui/*.png
          include-hidden-files: true
          retention-days: 7
      - run: cargo check --locked --workspace
